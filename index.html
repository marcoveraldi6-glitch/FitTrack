<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FitTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna da telefono; intestazione fissa in alto, quattro schede in basso.
   Numeri in condensato come i tabelloni di palestra; i macro usano i colori dei dischi olimpici
   (rosso = proteine, giallo = carboidrati, blu = grassi). */
:root{
  --bg:#eceee9;--surface:#fafbf8;--line:#d6dad2;--fg:#15181b;--mut:#596068;
  --acc:#c4321d;--on-acc:#ffffff;--ok:#2c7a37;--on-ok:#ffffff;--ft:#1d5bb8;--cb:#c99700;
  --slab:#17191c;--slab-fg:#eef0eb;--slab-mut:#a2a9b0;--spr:#ff5b3e;--scb:#f3c42f;--sft:#5d95f2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",-apple-system,system-ui,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--surface:#1b1e22;--line:#2c3137;--fg:#eceee9;--mut:#9ca3aa;
  --acc:#ff5b3e;--on-acc:#1a0b07;--ok:#5cba6a;--on-ok:#0b1a0d;--ft:#6ea0f5;--cb:#f3c42f;
  --slab:#22262b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417;--surface:#1b1e22;--line:#2c3137;--fg:#eceee9;--mut:#9ca3aa;
  --acc:#ff5b3e;--on-acc:#1a0b07;--ok:#5cba6a;--on-ok:#0b1a0d;--ft:#6ea0f5;--cb:#f3c42f;
  --slab:#22262b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* intestazione */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
header .wrap{padding-block:14px 12px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{display:block;font:600 12px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
h1{font:700 36px/1 var(--display);margin:4px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h2{font:700 21px/1.1 var(--display);margin:0;letter-spacing:.03em;text-transform:uppercase}
h3{font:600 17px/1.25 var(--body);margin:0}
.ico,.sq{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.back{display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--acc);font-weight:600;padding:8px 8px 8px 0;min-height:44px}
.dbar{display:flex;gap:8px;align-items:center}
.dbar input{flex:1;text-align:center}

/* contenuto */
main .wrap{padding-block:6px 150px;display:flex;flex-direction:column;gap:24px}
.block{display:flex;flex-direction:column;gap:10px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mut{color:var(--mut)}.small{font-size:14px}.center{text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pad{padding:14px}
.panel.pad{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit}
.li:first-child{border-top:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.grow b{font-weight:600;overflow-wrap:anywhere}
.grow .mut{font-size:14px}
.empty{padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p,.empty-t{margin:0;color:var(--mut)}
.empty-t{padding:14px}
.addrow{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--acc);font-weight:600;padding:13px 14px;min-height:48px}
.panel>.addrow:first-child{border-top:0}

/* comandi */
.pri,.sec,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:11px;padding:10px 16px;font-weight:600;font-size:15px;white-space:nowrap}
.pri{background:var(--acc);color:var(--on-acc);border:1px solid var(--acc)}
.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.ghost{background:transparent;color:var(--slab-fg);border:1px solid #ffffff33}
.sm{min-height:38px;padding:7px 12px;font-size:14px}
.wide{width:100%}
.link{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--acc);font-weight:600;padding:8px 0;min-height:44px}
.x{display:grid;place-items:center;width:40px;height:40px;flex:none;border:0;background:none;color:var(--mut);border-radius:10px}
.x.arm{width:auto;padding:0 10px;color:var(--acc);font-weight:600;font-size:14px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;min-height:44px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
label{font-size:13px;font-weight:500;color:var(--mut);display:block;margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inrow{display:flex;gap:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:28px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font:600 22px/1 var(--body);color:var(--mut)}
details[open] summary::after{content:"−"}
details.save summary{font-size:14px;color:var(--mut);padding:2px 2px}
details.save[open]{display:flex;flex-direction:column;gap:8px}

/* lavagna scura: riepilogo del giorno e sessione */
.slab{background:var(--slab);color:var(--slab-fg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.slab .smut,.seyebrow{color:var(--slab-mut)}
.seyebrow{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase}
.slab h2{font-size:26px}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font:700 68px/.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{font:600 15px/1.2 var(--body);color:var(--slab-mut)}
.meter{height:10px;border-radius:6px;background:#ffffff1f;overflow:hidden}
.meter i{display:block;height:100%;background:var(--slab-fg);border-radius:6px}
.meter i.over{background:var(--spr)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--slab-mut);font-variant-numeric:tabular-nums}
.macs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:12px;border-top:1px solid #ffffff1a}
.mac .ml{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--slab-mut)}
.mac b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.mac small{font:500 13px var(--body);color:var(--slab-mut)}
.mb{height:5px;border-radius:3px;background:#ffffff1f;margin-top:6px;overflow:hidden}
.mb i{display:block;height:100%}
.sbtn{display:flex;gap:10px;flex-wrap:wrap}
.sbtn .pri{flex:1}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:6px 0 0}
.kv dt{font-size:13px;color:var(--mut)}
.kv dd{margin:0;font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.sur{color:var(--ft)}.def{color:var(--ok)}
.sumline{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sumline b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}

/* schede */
.routine{padding:14px;display:flex;flex-direction:column;gap:12px}
.rh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.exl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exl li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.exl li:first-child{border-top:0}
.exl .mut{font-variant-numeric:tabular-nums;white-space:nowrap}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{flex:1;min-width:52px;height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:700 22px var(--display)}
.set.on{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.ok{border-color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:6px 12px;min-height:36px;font-size:14px;font-weight:500}
.res .mut{font-size:14px;white-space:nowrap}

/* progressi */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;min-height:38px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--fg);color:var(--bg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile span{font-size:13px;color:var(--mut)}
.tile b{display:block;font:700 30px/1.05 var(--display);font-variant-numeric:tabular-nums}
.chart{display:block;width:100%;height:auto}
.t{fill:var(--mut);font:11px var(--body)}
.legend{font-size:13px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* barra in basso e recupero */
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:9px 4px 8px;color:var(--mut);font-size:12px;font-weight:600;min-height:56px}
nav button.on{color:var(--acc)}
#rt{position:fixed;z-index:7;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--slab);color:var(--slab-fg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #0004}
#rt .rl{flex:1;display:flex;flex-direction:column}
#rt .rl span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--slab-mut)}
#rt .rl b{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums}
#rt button{background:#ffffff1a;color:var(--slab-fg);border:0;border-radius:10px;min-height:44px;min-width:48px;padding:0 10px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.meter i,.mb i{transition:width .4s ease}}
</style>
<!--BODY-->
<header><div class="wrap" id="hd"></div></header>
<main><div class="wrap" id="view"></div></main>
<div id="rt" hidden></div>
<nav aria-label="Sezioni"><div class="in" id="nv"></div></nav>
<script>
const K="fittrack.v1",KS="fittrack.sess";
let S={profile:{sex:"M",age:30,h:175,w:75,act:1.2},phases:[],exercises:["Panca piana","Squat","Stacco","Military press","Trazioni","Rematore","Corsa"],meals:[],work:[],weights:[],routines:[],foods:[],saved:[]};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.routines=S.routines||[];S.foods=S.foods||[];S.saved=S.saved||[];S.skip=S.skip||[];
/* un giorno conta nelle medie solo se ha pasti registrati e non è segnato come incompleto */
const counts=d=>!S.skip.includes(d)&&S.meals.some(m=>m.date===d);
function togSkip(){S.skip=S.skip.includes(day)?S.skip.filter(x=>x!==day):[...S.skip,day];save();render()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const num=id=>{const e=$(id);return e?parseFloat(String(e.value).replace(",","."))||0:0};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const R=Math.round,sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const N=v=>R(+v||0).toLocaleString("it-IT");
const today=()=>iso(new Date());
let day=today(),tab="oggi",sub=null,addSlot="Pranzo",exSel="",trEx="",rng=30,armed=null;

/* icone */
const ico={home:'<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/>',food:'<path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21V3c-2.5 0-4 2.5-4 7 0 3 1.5 4 4 4"/>',lift:'<path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/>',chart:'<path d="M3 20h18M6 16v-5M11 16V6M16 16v-8"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',play:'<path d="M7 4l13 8-13 8z"/>'};
const I=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ico[n]}</svg>`;

/* calcoli */
const curW=()=>{const w=[...S.weights].sort((a,b)=>a.date<b.date?1:-1)[0];return w?w.kg:S.profile.w};
const bmr=()=>{const p=S.profile;return 10*curW()+6.25*p.h-5*p.age+(p.sex==="M"?5:-161)};
const phaseOn=d=>S.phases.filter(p=>p.start<=d).sort((a,b)=>a.start<b.start?1:-1)[0];
function stats(d){const m=S.meals.filter(x=>x.date===d),w=S.work.filter(x=>x.date===d);
 const intake=sum(m,"kcal"),burned=sum(w,"kcal"),base=bmr()*S.profile.act;
 return {m,w,intake,burned,base,bal:intake-base-burned,p:sum(m,"p"),c:sum(m,"c"),f:sum(m,"f")}}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
function go(n){const d=new Date(day+"T12:00:00");d.setDate(d.getDate()+n);day=iso(d);render()}
const fd=d=>d.slice(8)+"/"+d.slice(5,7);
function dayName(d){const t=new Date(),o=n=>{const x=new Date(t);x.setDate(x.getDate()+n);return iso(x)};
 if(d===o(0))return"Oggi";if(d===o(-1))return"Ieri";if(d===o(1))return"Domani";
 return new Date(d+"T12:00:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})}
const dateBar=()=>`<div class="dbar"><button class="sq" aria-label="Giorno precedente" onclick="go(-1)">${I("left")}</button><input id="dt" type="date" aria-label="Data" value="${day}" onchange="day=this.value||day;render()"><button class="sq" aria-label="Giorno successivo" onclick="go(1)">${I("right")}</button></div>`;
function setTab(t){tab=t;sub=null;render()}
function openSub(n){sub=n;render()}
function closeSub(){if(sub==="builder"&&$("bn"))rb.name=$("bn").value;sub=null;pick=null;render()}

/* grafici */
const COL=["var(--acc)","var(--ft)","var(--ok)","var(--cb)"];
function bands(dates,X,H,t,b){const pid=dates.map(d=>{const p=phaseOn(d);return p?S.phases.indexOf(p):-1});let o="",i=0;const h=dates.length>1?(X(1)-X(0))/2:0;
 while(i<dates.length){let j=i;while(j+1<dates.length&&pid[j+1]===pid[i])j++;
  if(pid[i]>=0){const x1=X(i)-(i?h:0),x2=X(j)+(j<dates.length-1?h:0);
   o+=`<rect x="${x1}" y="${t}" width="${x2-x1}" height="${H-t-b}" style="fill:${COL[pid[i]%4]}" opacity=".1"/><text class="t" x="${x1+4}" y="${t+11}">${esc(S.phases[pid[i]].name)}</text>`}
  i=j+1}return o}
const wrap=(o,W,H,dates,X,lab)=>`<svg class="chart" role="img" aria-label="${lab}" viewBox="0 0 ${W} ${H}">${o}<text class="t" x="${X(0)}" y="${H-4}">${fd(dates[0])}</text><text class="t" text-anchor="end" x="${X(dates.length-1)}" y="${H-4}">${fd(dates[dates.length-1])}</text></svg>`;
function line(dates,series,cols,lab){const W=340,H=170,l=38,r=8,t=8,b=20,n=dates.length;
 const all=series.flat().filter(v=>v!=null);if(all.length<2)return '<p class="mut small">Servono almeno due valori nel periodo.</p>';
 let mn=Math.min(...all),mx=Math.max(...all);if(mn===mx){mn--;mx++}const p=(mx-mn)*.12;mn-=p;mx+=p;
 const X=i=>l+i*(W-l-r)/Math.max(1,n-1),Y=v=>t+(mx-v)*(H-t-b)/(mx-mn);
 let o=bands(dates,X,H,t,b);
 for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;o+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text class="t" x="2" y="${Y(v)+4}">${v.toFixed(1)}</text>`}
 series.forEach((s,k)=>{let d="";s.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)});
  o+=`<path d="${d}" style="fill:none;stroke:${cols[k]}" stroke-width="${k?2.5:1.5}" stroke-linejoin="round"/>`;
  if(!k)s.forEach((v,i)=>{if(v!=null)o+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" style="fill:${cols[0]}"/>`})});
 return wrap(o,W,H,dates,X,lab)}
function bars(dates,vals,sign,lab){const W=340,H=150,l=38,r=8,t=8,b=20,n=dates.length;
 const a=vals.filter(v=>v!=null);if(!a.length)return '<p class="mut small">Nessun dato nel periodo.</p>';
 const mx=Math.max(...a.map(Math.abs),1),mn=sign?-mx:0;
 const X=i=>l+i*(W-l-r)/Math.max(1,n-1),Y=v=>t+(mx-v)*(H-t-b)/(mx-mn),bw=Math.max(2,(W-l-r)/n*.7);
 let o=bands(dates,X,H,t,b)+`<line x1="${l}" x2="${W-r}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--mut)"/><text class="t" x="2" y="${Y(mx)+4}">${R(mx)}</text><text class="t" x="2" y="${Y(sign?mn:0)+4}">${sign?R(mn):0}</text>`;
 vals.forEach((v,i)=>{if(v!=null)o+=`<rect x="${X(i)-bw/2}" y="${Math.min(Y(v),Y(0))}" width="${bw}" height="${Math.max(1,Math.abs(Y(v)-Y(0)))}" style="fill:${sign?(v>0?"var(--ft)":"var(--ok)"):"var(--acc)"}" rx="1.5"/>`});
 return wrap(o,W,H,dates,X,lab)}

/* sessione e recuperi */
let ss=null,rb={name:"",items:[]},rest=null,wl=null,ac=null,msg="",stopArm=false;
try{const r=localStorage.getItem(KS);if(r)ss=JSON.parse(r)}catch(e){}
const saveSess=()=>{try{ss?localStorage.setItem(KS,JSON.stringify(ss)):localStorage.removeItem(KS)}catch(e){}};
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0");return h?h+":"+String(m).padStart(2,"0")+":"+x:m+":"+x};
const unlock=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}};
function beep(){try{const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),600)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function tick(){const el=$("rt");if(!el)return;
 if(rest){const left=(rest.end-Date.now())/1000;if(left<=0){beep();rest=null}else{const l=$("rl");if(l)l.textContent=mmss(left)}}
 if(!rest)el.hidden=true;
 const e=$("el");if(e&&ss)e.textContent=mmss((Date.now()-ss.t0)/1000)}
setInterval(tick,250);
function startRest(s){rest={end:Date.now()+s*1000};const el=$("rt");
 el.innerHTML='<div class="rl"><span>Recupero</span><b id="rl"></b></div><button onclick="rAdd(-15)" aria-label="Togli 15 secondi">−15</button><button onclick="rAdd(15)" aria-label="Aggiungi 15 secondi">+15</button><button onclick="rest=null;tick()">Salta</button>';el.hidden=false;tick()}
function rAdd(n){if(rest)rest.end+=n*1000}
const lastOf=ex=>S.work.filter(x=>x.exercise===ex).sort((a,b)=>a.date<b.date?1:-1)[0];
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{})}catch(e){}}
function startSess(id){const r=S.routines.find(x=>x.id===id);if(!r)return;unlock();
 ss={name:r.name,t0:Date.now(),items:r.items.map(i=>({...i,done:0}))};saveSess();wake();tab="allena";sub=null;render()}
function chip(i,k){const it=ss.items[i];unlock();if(k<=it.done){it.done=k-1}else{it.done=k;startRest(it.rest)}saveSess();render()}
function setIt(i,f,v){ss.items[i][f]=+String(v).replace(",",".")||0;saveSess()}
function endSess(){const dur=(Date.now()-ss.t0)/3600000,tot=ss.items.reduce((s,i)=>s+i.done,0)||1,k=5*curW()*dur;
 ss.items.forEach(i=>{if(i.done>0)S.work.push({id:uid(),date:today(),exercise:i.ex,sets:i.done,reps:i.reps,kg:i.kg,kcal:k*i.done/tot})});
 if(wl){try{wl.release()}catch(e){}wl=null}rest=null;tick();msg="Allenamento salvato: "+N(k)+" kcal stimate in "+R(dur*60)+" minuti.";ss=null;saveSess();save();render()}
function stopSess(){if(!stopArm){stopArm=true;render();setTimeout(()=>{if(stopArm){stopArm=false;render()}},3000);return}
 stopArm=false;ss=null;saveSess();rest=null;tick();render()}
document.addEventListener("visibilitychange",()=>{if(ss&&document.visibilityState==="visible")wake()});

/* alimenti */
let pick=null,res=[];
const SL=["Colazione","Pranzo","Cena","Spuntini"];
const FD=("Pasta cruda|353|11|79|1.4;Pasta cotta|158|5.8|31|0.9;Riso crudo|350|7|79|0.6;Riso cotto|130|2.7|28|0.3;Pane|275|8.5|58|0.5;Fette biscottate|410|11|75|5;Fiocchi d’avena|372|13|60|7;Patate|77|2|17|0.1;Patate dolci|86|1.6|20|0.1;Petto di pollo crudo|110|23|0|1.2;Petto di tacchino|107|24|0|1;Manzo magro|130|21|0|5;Salmone|185|20|0|12;Merluzzo|71|16|0|0.4;Tonno al naturale|103|24|0|1;Tonno sott’olio|190|25|0|10;Uova intere|128|12.5|0.7|8.7;Albume|44|10|0.7|0;Prosciutto cotto|215|19|1|15;Prosciutto crudo|235|26|0|15;Bresaola|150|32|0|2;Latte intero|64|3.3|4.9|3.6;Latte parz. scremato|46|3.3|5|1.6;Yogurt greco 0%|57|10|4|0.2;Yogurt bianco|60|4|5|3;Mozzarella|253|18|1|20;Parmigiano|392|33|0|28;Ricotta|146|8.8|3.5|10.9;Olio extravergine|899|0|0|100;Burro|758|0.8|1|83;Mandorle|579|21|22|50;Noci|654|15|14|65;Burro d’arachidi|588|25|20|50;Banana|89|1.1|23|0.3;Mela|52|0.3|14|0.2;Arancia|47|0.9|12|0.1;Fragole|32|0.7|7.7|0.3;Frutti di bosco|57|0.7|14|0.3;Insalata|15|1.4|2.9|0.2;Pomodori|18|0.9|3.9|0.2;Zucchine|17|1.2|3.1|0.3;Broccoli|34|2.8|7|0.4;Spinaci|23|2.9|3.6|0.4;Carote|41|0.9|10|0.2;Lenticchie cotte|116|9|20|0.4;Ceci cotti|164|8.9|27|2.6;Fagioli cotti|127|8.7|23|0.5;Tofu|76|8|1.9|4.8;Passata di pomodoro|30|1.5|5|0.2;Pizza margherita|270|11|33|10;Cioccolato fondente|598|8|46|43;Biscotti secchi|430|7|75|11;Miele|304|0.3|82|0;Marmellata|250|0.4|60|0.1;Proteine whey|400|80|8|6;Birra|43|0.5|3.6|0;Vino|85|0.1|2.6|0").split(";").map(s=>{const a=s.split("|");return{n:a[0],k:+a[1],p:+a[2],c:+a[3],f:+a[4]}});
/* ricerca: senza accenti e apostrofi, più parole in qualsiasi ordine, singolare/plurale, piccoli errori di battitura */
let fq="";
const nrm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’'`.,()%/-]/g," ").replace(/\s+/g," ").trim();
const stem=w=>w.length>3?w.replace(/[aeiou]$/,""):w;
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1}
function score(food,toks){const words=nrm(food.n).split(" "),full=words.join(" ");let sc=0;
 for(const t of toks){const st=stem(t);let best=0;
  for(const w of words){if(w===t)best=Math.max(best,4);else if(w.startsWith(t))best=Math.max(best,3);else if(stem(w)===st||w.startsWith(st)&&st.length>=3)best=Math.max(best,2.5);else if(t.length>=4&&lev1(stem(w),st))best=Math.max(best,1.5);else if(t.length>=3&&w.includes(t))best=Math.max(best,1)}
  if(!best&&t.length>=4&&full.replace(/ /g,"").includes(t))best=2;
  if(!best)return 0;sc+=best}
 if(full.startsWith(toks.join(" ")))sc+=2;else if(stem(words[0])===stem(toks[0]))sc+=1.5;return sc+(food.u?.5:0)}
function allFoods(){const seen=new Set(),a=[];for(const x of [...S.foods.map(x=>({...x,u:1})),...FD]){const k=nrm(x.n);if(!seen.has(k)){seen.add(k);a.push(x)}}return a}
function recentFoods(){const a=allFoods(),by=new Map(a.map(x=>[nrm(x.n),x])),out=[],seen=new Set();
 for(const m of [...S.meals].reverse()){const n=nrm(m.fn||String(m.name||"").replace(/\s+\d+([.,]\d+)?\s*g$/,""));const f=by.get(n);if(f&&!seen.has(n)){seen.add(n);out.push(f)}if(out.length>=8)break}
 return out}
function fl(){const q=$("fq");if(!q)return;fq=q.value;const toks=nrm(fq).split(" ").filter(Boolean);let head="";
 if(toks.length){res=allFoods().map(x=>({x,s:score(x,toks)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s||a.x.n.length-b.x.n.length).slice(0,20).map(o=>o.x)}
 else{const r=recentFoods();res=r.length?r:allFoods().slice(0,8);head=`<p class="mut small" style="margin:0;padding:10px 14px 0">${r.length?"Usati di recente":"Suggeriti"}</p>`}
 $("fr").innerHTML=res.length?head+res.map((x,i)=>`<button class="li res" onclick="pickF(${i})"><span class="grow"><b>${esc(x.n)}${x.u?" ★":""}</b><span class="mut">P ${x.p} · C ${x.c} · G ${x.f}</span></span><span class="mut">${N(x.k)} kcal/100 g</span></button>`).join(""):'<p class="empty-t">Nessun alimento trovato. Aggiungilo qui sotto come alimento personalizzato.</p>'}
function pickF(i){pick=res[i];
 $("pk").innerHTML=`<div class="panel pad ok"><h3>${esc(pick.n)}</h3><div class="inrow"><input id="pg" type="number" inputmode="decimal" value="100" aria-label="Grammi" oninput="pv()"><span class="mut" style="align-self:center">grammi</span></div><div class="chips">${[30,50,100,150,200,250].map(g=>`<button onclick="$('pg').value=${g};pv()">${g} g</button>`).join("")}</div><p class="mut small" id="pp" style="margin:0"></p><button class="pri wide" onclick="addF()">Aggiungi a ${esc(addSlot.toLowerCase())}</button></div>`;pv();$("pk").scrollIntoView({block:"nearest",behavior:"smooth"})}
function pv(){const r=num("pg")/100;$("pp").textContent=N(pick.k*r)+" kcal · P "+(pick.p*r).toFixed(1)+" · C "+(pick.c*r).toFixed(1)+" · G "+(pick.f*r).toFixed(1)}
function addF(){const g=num("pg");if(g<=0||!pick)return;const r=g/100;S.meals.push({id:uid(),date:day,slot:addSlot,fn:pick.n,name:pick.n+" "+g+" g",kcal:pick.k*r,p:pick.p*r,c:pick.c*r,f:pick.f*r});pick=null;fq="";save();render()}
function addCF(){const n=$("cn").value.trim();if(!n)return;S.foods.push({n,k:num("ck"),p:num("cp"),c:num("cc"),f:num("cf")});save();render();const q=$("fq");if(q){q.value=n;fl()}}
function saveMeal(sl){const n=$("sn"+SL.indexOf(sl)).value.trim();if(!n)return;S.saved.push({id:uid(),name:n,items:S.meals.filter(m=>m.date===day&&(m.slot||"Spuntini")===sl).map(m=>({name:m.name,kcal:m.kcal,p:m.p,c:m.c,f:m.f}))});save();render()}
function useSaved(id){const s=S.saved.find(x=>x.id===id);if(!s)return;s.items.forEach(m=>S.meals.push({...m,id:uid(),date:day,slot:addSlot}));save();render()}
function copyPrev(){const d=new Date(day+"T12:00:00");d.setDate(d.getDate()-1);const p=iso(d);S.meals.filter(m=>m.date===p&&(m.slot||"Spuntini")===addSlot).forEach(m=>S.meals.push({...m,id:uid(),date:day}));save();render()}
function openAdd(sl){addSlot=sl;fq="";tab="cibo";sub="add";pick=null;render();setTimeout(()=>{const q=$("fq");if(q)q.focus()},50)}
function setW(){const v=num("wv");if(v>0){S.weights=S.weights.filter(x=>x.date!==day);S.weights.push({date:day,kg:v});save();render()}}
const itemRow=m=>`<div class="li"><div class="grow"><b>${esc(m.name||"Pasto")}</b><span class="mut">${N(m.kcal)} kcal · P ${R(m.p)} · C ${R(m.c)} · G ${R(m.f)}</span></div><button class="x" aria-label="Elimina" onclick="del('meals','${m.id}')">${I("x",18)}</button></div>`;
const workRow=x=>`<div class="li"><div class="grow"><b>${esc(x.exercise)}</b><span class="mut">${x.sets}×${x.reps}${x.kg?" a "+x.kg+" kg":""} · ${N(x.kcal)} kcal</span></div><button class="x" aria-label="Elimina" onclick="del('work','${x.id}')">${I("x",18)}</button></div>`;

/* OGGI */
function vOggi(){const s=stats(day),ph=phaseOn(day),t=ph?ph.kcal:0,left=t?t-s.intake:null,wt=S.weights.find(x=>x.date===day);
 const mac=(l,c,v,g)=>`<div class="mac"><span class="ml">${l}</span><b>${R(v)}<small>${g?" / "+g:""} g</small></b><div class="mb"><i style="width:${g?Math.min(100,v/g*100):0}%;background:var(${c})"></i></div></div>`;
 const hero=`<section class="slab" aria-label="Calorie del giorno"><div class="bignum"><span class="num">${N(left!==null?Math.abs(left):s.intake)}</span><span class="unit">${left===null?"kcal mangiate":left>=0?"kcal rimaste":"kcal oltre il target"}</span></div>
 ${t?`<div class="meter"><i class="${left<0?"over":""}" style="width:${Math.min(100,s.intake/t*100)}%"></i></div><div class="meta"><span>${N(s.intake)} mangiate</span><span>target ${N(t)}</span></div>`:`<p class="smut" style="margin:0">Crea una fase in Piano per avere target di kcal e macro.</p>`}
 <div class="macs">${mac("Proteine","--spr",s.p,ph&&ph.p)}${mac("Carbo","--scb",s.c,ph&&ph.c)}${mac("Grassi","--sft",s.f,ph&&ph.f)}</div></section>`;
 let wk;
 if(ss)wk=`<div class="panel"><div class="li"><div class="grow"><b>${esc(ss.name)}</b><span class="mut">In corso da <span>${mmss((Date.now()-ss.t0)/1000)}</span></span></div><button class="pri sm" onclick="setTab('allena')">Riprendi</button></div></div>`;
 else if(S.routines.length)wk=`<div class="panel">${S.routines.map(r=>`<div class="li"><div class="grow"><b>${esc(r.name)}</b><span class="mut">${r.items.length} esercizi</span></div><button class="pri sm" onclick="startSess('${r.id}')">${I("play",14)} Avvia</button></div>`).join("")}</div>`;
 else wk=`<div class="panel empty"><p>Nessuna scheda ancora. Creane una per ogni allenamento della settimana.</p><button class="sec" onclick="tab='allena';openSub('builder')">Crea scheda</button></div>`;
 if(s.w.length)wk+=`<p class="mut small" style="margin:0">Registrati in questo giorno: ${s.w.length} esercizi · ${N(s.burned)} kcal</p>`;
 const meals=`<div class="panel">${SL.map(sl=>{const k=sum(s.m.filter(m=>(m.slot||"Spuntini")===sl),"kcal");return `<div class="li"><div class="grow"><b>${sl}</b><span class="mut">${k?N(k)+" kcal":"Niente ancora"}</span></div><button class="sq" aria-label="Aggiungi a ${sl}" onclick="openAdd('${sl}')">${I("plus")}</button></div>`}).join("")}</div>`;
 const body=`<div class="panel pad"><label for="wv">Peso del giorno (kg)</label><div class="inrow"><input id="wv" type="number" step="0.1" inputmode="decimal" value="${wt?wt.kg:""}" placeholder="${curW()}"><button class="pri" onclick="setW()">Salva</button></div>
 <dl class="kv"><div><dt>Metabolismo basale</dt><dd>${N(bmr())}</dd></div><div><dt>Spesa senza allenamenti</dt><dd>${N(s.base)}</dd></div><div><dt>Bruciate allenandoti</dt><dd>${N(s.burned)}</dd></div><div><dt>Bilancio</dt><dd class="${s.bal>0?"sur":"def"}">${s.bal>0?"+":""}${N(s.bal)}</dd></div></dl></div>`;
 return hero+`<section class="block"><div class="bh"><h2>Allenamento</h2><button class="link" onclick="setTab('allena')">Tutte le schede</button></div>${wk}</section>
 <section class="block"><div class="bh"><h2>Pasti</h2><button class="link" onclick="setTab('cibo')">Dettaglio</button></div>${meals}</section>
 <section class="block"><h2>Corpo e bilancio</h2>${body}</section>`}

/* CIBO */
function vCibo(){const s=stats(day),ph=phaseOn(day);
 return `<div class="sumline"><span><b>${N(s.intake)}</b> <span class="mut">${ph?"/ "+N(ph.kcal)+" ":""}kcal</span></span><span class="mut small">P ${R(s.p)} · C ${R(s.c)} · G ${R(s.f)} g</span></div>
 <label class="panel pad" style="flex-direction:row;align-items:center;gap:12px;margin:0;color:var(--fg);font-size:15px;cursor:pointer"><input type="checkbox" style="width:22px;height:22px;min-height:0;flex:none;accent-color:var(--acc)" ${S.skip.includes(day)?"checked":""} onchange="togSkip()"><span class="grow"><b>Giornata incompleta</b><span class="mut">Ho saltato pasti o non li ho segnati tutti: non contarla nelle medie</span></span></label>`+
 SL.map((sl,k)=>{const it=s.m.filter(m=>(m.slot||"Spuntini")===sl);return `<section class="block"><div class="bh"><h2>${sl}</h2><span class="mut small">${N(sum(it,"kcal"))} kcal</span></div><div class="panel">${it.map(itemRow).join("")}<button class="addrow" onclick="openAdd('${sl}')">${I("plus",18)} Aggiungi alimento</button></div>
 ${it.length?`<details class="save"><summary>Salva come pasto da ripetere</summary><div class="inrow"><input id="sn${k}" aria-label="Nome del pasto" placeholder="Es. Colazione standard"><button class="sec" onclick="saveMeal('${sl}')">Salva</button></div></details>`:""}</section>`}).join("")}
function vAdd(){const it=S.meals.filter(m=>m.date===day&&(m.slot||"Spuntini")===addSlot);
 return `<section class="block"><label for="fq" class="vh">Cerca alimento</label><input id="fq" type="search" value="${esc(fq)}" placeholder="Cerca: pasta, pollo, yogurt…" oninput="fl()" autocomplete="off"><div class="panel" id="fr"></div><div id="pk"></div></section>
 <div class="inrow"><button class="sec wide" onclick="copyPrev()">Copia ${esc(addSlot.toLowerCase())} di ieri</button></div>
 ${S.saved.length?`<section class="block"><h2>Pasti salvati</h2><div class="panel">${S.saved.map(x=>`<div class="li"><div class="grow"><b>${esc(x.name)}</b><span class="mut">${N(sum(x.items,"kcal"))} kcal · ${x.items.length} alimenti</span></div><button class="sec sm" onclick="useSaved('${x.id}')">Usa</button><button class="x" aria-label="Elimina pasto salvato" onclick="del('saved','${x.id}')">${I("x",18)}</button></div>`).join("")}</div></section>`:""}
 <section class="block"><div class="bh"><h2>Già inserito</h2><span class="mut small">${N(sum(it,"kcal"))} kcal</span></div><div class="panel">${it.length?it.map(itemRow).join(""):'<p class="empty-t">Ancora niente in questo pasto.</p>'}</div></section>
 <details class="panel pad"><summary><b>Nuovo alimento personalizzato</b></summary><p class="mut small" style="margin:0">Valori per 100 g. Lo ritrovi nella ricerca con la stella.</p><label for="cn">Nome</label><input id="cn" style="margin-top:-6px"><div class="f2"><div><label for="ck">kcal</label><input id="ck" type="number" inputmode="decimal"></div><div><label for="cp">Proteine g</label><input id="cp" type="number" inputmode="decimal"></div><div><label for="cc">Carboidrati g</label><input id="cc" type="number" inputmode="decimal"></div><div><label for="cf">Grassi g</label><input id="cf" type="number" inputmode="decimal"></div></div><button class="pri wide" onclick="addCF()">Salva alimento</button></details>`}

/* ALLENA */
function delR(id){if(armed===id){armed=null;del("routines",id)}else{armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render()}},3000)}}
function vAllena(){if(ss)return vSess();const m=msg;msg="";const t=stats(today());
 const rs=S.routines.length?S.routines.map(r=>`<article class="panel routine"><div class="rh"><h3>${esc(r.name)}</h3><button class="x${armed===r.id?" arm":""}" aria-label="Elimina scheda" onclick="delR('${r.id}')">${armed===r.id?"Elimina?":I("x",18)}</button></div><ul class="exl">${r.items.map(i=>`<li><span>${esc(i.ex)}</span><span class="mut">${i.sets}×${i.reps}${i.kg?" · "+i.kg+" kg":""}</span></li>`).join("")}</ul><button class="pri wide" onclick="startSess('${r.id}')">${I("play",16)} Avvia allenamento</button></article>`).join("")
 :`<div class="panel empty"><p>Crea una scheda per ogni allenamento: per esempio tre per la sala pesi e due per la corsa.</p><button class="pri" onclick="openSub('builder')">Crea la prima scheda</button></div>`;
 return (m?`<div class="panel pad ok"><b>${esc(m)}</b></div>`:"")+`<section class="block"><div class="bh"><h2>Le tue schede</h2><button class="link" onclick="openSub('builder')">${I("plus",16)} Nuova</button></div>${rs}</section>
 <section class="block"><div class="bh"><h2>Fatto oggi</h2><span class="mut small">${N(t.burned)} kcal</span></div><div class="panel">${t.w.map(workRow).join("")}<button class="addrow" onclick="day=today();openSub('log')">${I("plus",18)} Registra un esercizio a mano</button></div></section>`}
function vSess(){return `<section class="slab" aria-label="Sessione in corso"><span class="seyebrow">In corso</span><h2>${esc(ss.name)}</h2><span class="num" id="el">${mmss((Date.now()-ss.t0)/1000)}</span><div class="sbtn"><button class="pri" onclick="endSess()">Termina e salva</button><button class="ghost" onclick="stopSess()">${stopArm?"Tocca ancora per annullare":"Annulla"}</button></div></section>`+
 ss.items.map((it,i)=>{const l=lastOf(it.ex);return `<article class="panel pad"><div class="rh"><h3>${esc(it.ex)}</h3><span class="mut small">${it.done}/${it.sets} serie</span></div><p class="mut small" style="margin:0">${it.sets}×${it.reps} · recupero ${it.rest}s${l?` · ultima volta ${l.sets}×${l.reps} a ${l.kg} kg`:""}</p>
 <div class="f2"><div><label for="k${i}">Carico kg</label><input id="k${i}" type="number" step="0.5" inputmode="decimal" value="${it.kg||""}" onchange="setIt(${i},'kg',this.value)"></div><div><label for="r${i}">Ripetizioni</label><input id="r${i}" type="number" inputmode="numeric" value="${it.reps}" onchange="setIt(${i},'reps',this.value)"></div></div>
 <div class="sets">${Array.from({length:it.sets},(_,k)=>`<button class="set${k<it.done?" on":""}" aria-label="Serie ${k+1}${k<it.done?", fatta":""}" onclick="chip(${i},${k+1})">${k+1}</button>`).join("")}</div></article>`}).join("")+
 '<p class="mut small center" style="margin:0">Tocca il numero della serie appena finita: parte il recupero.</p>'}
function vLog(){if(!exSel||!S.exercises.includes(exSel))exSel=S.exercises[0]||"";
 const hist=S.work.filter(x=>x.exercise===exSel).sort((a,b)=>a.date<b.date?1:-1),pr=hist.reduce((m,x)=>Math.max(m,+x.kg||0),0),last=hist[0],s=stats(day);
 return `<section class="panel pad"><div><label for="exs">Esercizio</label><select id="exs" onchange="exSel=this.value;render()">${S.exercises.map(e=>`<option ${e===exSel?"selected":""}>${esc(e)}</option>`).join("")}</select></div>
 <p class="mut small" style="margin:0">${last?`Ultima volta ${last.sets}×${last.reps} a ${last.kg} kg (${fd(last.date)}) · record ${pr} kg`:"Nessuna serie registrata per questo esercizio."}</p>
 <div class="f2"><div><label for="ws">Serie</label><input id="ws" type="number" inputmode="numeric" value="${last?last.sets:3}"></div><div><label for="wr">Ripetizioni</label><input id="wr" type="number" inputmode="numeric" value="${last?last.reps:10}"></div><div><label for="wk">Carico kg</label><input id="wk" type="number" step="0.5" inputmode="decimal" value="${last?last.kg:""}"></div><div><label for="wc">kcal bruciate</label><input id="wc" type="number" inputmode="decimal"></div></div>
 <button class="pri wide" onclick="addWork()">Registra</button></section>
 <section class="block"><div class="bh"><h2>Registrati · ${esc(dayName(day))}</h2><span class="mut small">${N(s.burned)} kcal</span></div><div class="panel">${s.w.length?s.w.map(workRow).join(""):'<p class="empty-t">Niente in questo giorno.</p>'}</div></section>
 <details class="panel pad"><summary><b>Gestisci esercizi</b></summary><div class="inrow"><input id="ne" aria-label="Nuovo esercizio" placeholder="Nuovo esercizio"><button class="sec" onclick="addEx()">Aggiungi</button></div><div class="panel">${S.exercises.map((e,i)=>`<div class="li"><span class="grow">${esc(e)}</span><button class="x" aria-label="Rimuovi ${esc(e)}" onclick="rmEx(${i})">${I("x",18)}</button></div>`).join("")}</div></details>`}
function addEx(){const n=$("ne").value.trim();if(n&&!S.exercises.includes(n)){S.exercises.push(n);exSel=n;save();render()}}
function rmEx(i){S.exercises.splice(i,1);save();render()}
function addWork(){if(!exSel)return;S.work.push({id:uid(),date:day,exercise:exSel,sets:num("ws"),reps:num("wr"),kg:num("wk"),kcal:num("wc")});save();render()}
function rbAdd(){rb.name=$("bn").value;let ex=$("bnx").value.trim()||$("bx").value;if(!ex)return;
 if(!S.exercises.includes(ex)){S.exercises.push(ex);save()}
 rb.items.push({ex,sets:num("bs")||3,reps:num("br")||10,kg:num("bw"),rest:num("bt")||90});render()}
function rbDel(i){rb.name=$("bn").value;rb.items.splice(i,1);render()}
function rbSave(){rb.name=$("bn").value.trim();if(!rb.name){$("bn").focus();return}if(!rb.items.length)return;S.routines.push({id:uid(),name:rb.name,items:rb.items});rb={name:"",items:[]};save();tab="allena";sub=null;render()}
function vBuilder(){return `<section class="panel pad"><label for="bn">Nome della scheda</label><input id="bn" placeholder="Es. Lunedì · Petto e tricipiti" value="${esc(rb.name)}" style="margin-top:-6px"></section>
 <section class="block"><h2>Esercizi</h2><div class="panel">${rb.items.length?rb.items.map((i,k)=>`<div class="li"><div class="grow"><b>${k+1}. ${esc(i.ex)}</b><span class="mut">${i.sets}×${i.reps} · ${i.kg||0} kg · recupero ${i.rest}s</span></div><button class="x" aria-label="Togli ${esc(i.ex)}" onclick="rbDel(${k})">${I("x",18)}</button></div>`).join(""):'<p class="empty-t">Aggiungi il primo esercizio qui sotto.</p>'}</div></section>
 <section class="panel pad"><div><label for="bx">Esercizio</label><select id="bx">${S.exercises.map(e=>`<option>${esc(e)}</option>`).join("")}</select></div><input id="bnx" aria-label="Nuovo esercizio" placeholder="Oppure scrivine uno nuovo">
 <div class="f2"><div><label for="bs">Serie</label><input id="bs" type="number" inputmode="numeric" value="3"></div><div><label for="br">Ripetizioni</label><input id="br" type="number" inputmode="numeric" value="10"></div><div><label for="bw">Carico kg</label><input id="bw" type="number" step="0.5" inputmode="decimal"></div><div><label for="bt">Recupero (s)</label><input id="bt" type="number" inputmode="numeric" value="90"></div></div>
 <button class="sec wide" onclick="rbAdd()">${I("plus",18)} Aggiungi alla scheda</button></section>
 <button class="pri wide" onclick="rbSave()" ${rb.items.length?"":"disabled style=\"opacity:.5\""}>Salva scheda</button>`}

/* PROGRESSI */
function vProg(){const dates=[];for(let i=rng-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dates.push(iso(d))}
 if(!trEx||!S.exercises.includes(trEx))trEx=S.exercises[0]||"";
 const wm=Object.fromEntries(S.weights.map(x=>[x.date,x.kg])),w=dates.map(d=>wm[d]??null);
 /* media mobile sulle ultime 7 pesate effettive: i giorni senza pesata non pesano */
 const ma=w.map((v,i)=>{if(v==null)return null;const a=w.slice(0,i+1).filter(x=>x!=null).slice(-7);return a.reduce((s,x)=>s+x,0)/a.length});
 const ok=dates.map(counts),mean=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
 const bal=dates.map((d,i)=>ok[i]?stats(d).bal:null),avg=mean(bal)===null?null:R(mean(bal));
 const pro=dates.map((d,i)=>ok[i]?stats(d).p:null),kc=dates.map((d,i)=>ok[i]?stats(d).intake:null);
 const pAvg=mean(pro),kAvg=mean(kc),nOk=ok.filter(Boolean).length,ph=phaseOn(today());
 const wv=w.filter(v=>v!=null),dw=wv.length>1?wv[wv.length-1]-wv[0]:null;
 const sess=new Set(S.work.filter(x=>x.date>=dates[0]).map(x=>x.date)).size;
 const ew=S.work.filter(x=>x.exercise===trEx);
 const mxk=dates.map(d=>{const a=ew.filter(x=>x.date===d);return a.length?Math.max(...a.map(x=>+x.kg||0)):null});
 const vol=dates.map(d=>{const a=ew.filter(x=>x.date===d);return a.length?a.reduce((s,x)=>s+x.sets*x.reps*x.kg,0):null});
 return `<div class="seg" role="group" aria-label="Periodo">${[14,30,90].map(n=>`<button class="${n===rng?"on":""}" onclick="rng=${n};render()">${n} giorni</button>`).join("")}</div>
 <div class="tiles"><div class="tile"><span>Peso attuale</span><b>${curW().toLocaleString("it-IT")} kg</b></div><div class="tile"><span>Variazione</span><b>${dw===null?"—":(dw>0?"+":"")+dw.toFixed(1).replace(".",",")+" kg"}</b></div><div class="tile"><span>Bilancio medio</span><b class="${avg>0?"sur":"def"}">${avg===null?"—":(avg>0?"+":"")+N(avg)}</b></div><div class="tile"><span>Giorni di allenamento</span><b>${sess}</b></div>
 <div class="tile"><span>Proteine medie</span><b>${pAvg===null?"—":R(pAvg)+" g"}</b><span>${pAvg===null?"":(pAvg/curW()).toFixed(1).replace(".",",")+" g/kg"+(ph&&ph.p?" · target "+ph.p:"")}</span></div>
 <div class="tile"><span>Kcal medie</span><b>${kAvg===null?"—":N(kAvg)}</b><span>${ph?"target "+N(ph.kcal):""}</span></div></div>
 <p class="mut small" style="margin:-14px 0 0">Medie su ${nOk} ${nOk===1?"giorno valido":"giorni validi"} su ${rng}: esclusi i giorni senza pasti e quelli segnati come incompleti.</p>
 <section class="block"><h2>Proteine</h2><div class="panel pad">${bars(dates,pro,false,"Proteine giornaliere")}<p class="mut small" style="margin:0">Grammi al giorno, solo giorni validi.</p></div></section>
 <section class="block"><h2>Peso</h2><div class="panel pad">${line(dates,[w,ma],["var(--mut)","var(--acc)"],"Andamento del peso")}<div class="legend"><span><i style="background:var(--mut)"></i>Pesate</span><span><i style="background:var(--acc)"></i>Media ultime 7 pesate</span></div></div></section>
 <section class="block"><h2>Bilancio calorico</h2><div class="panel pad">${bars(dates,bal,true,"Bilancio calorico giornaliero")}<div class="legend"><span><i style="background:var(--ft)"></i>Surplus</span><span><i style="background:var(--ok)"></i>Deficit</span></div></div></section>
 <section class="block"><h2>Forza</h2><div class="panel pad"><label for="tre" class="vh">Esercizio</label><select id="tre" onchange="trEx=this.value;render()">${S.exercises.map(e=>`<option ${e===trEx?"selected":""}>${esc(e)}</option>`).join("")}</select>
 <p class="mut small" style="margin:4px 0 0">Carico massimo (kg)</p>${line(dates,[mxk],["var(--acc)"],"Carico massimo")}<p class="mut small" style="margin:4px 0 0">Volume (serie × ripetizioni × kg)</p>${bars(dates,vol,false,"Volume di allenamento")}</div></section>`}

/* PIANO */
function vPiano(){const p=S.profile,cur=phaseOn(today()),m=msg;msg="";
 return (m?`<div class="panel pad ok"><b>${esc(m)}</b></div>`:"")+`<section class="block"><h2>Fasi</h2>
 <div class="panel">${S.phases.length?[...S.phases].sort((a,b)=>a.start<b.start?1:-1).map(f=>`<div class="li"><div class="grow"><b>${esc(f.name)}${f===cur?" · attiva":""}</b><span class="mut">dal ${fd(f.start)} · ${N(f.kcal)} kcal · P ${f.p||0} C ${f.c||0} G ${f.f||0}</span></div><button class="x" aria-label="Elimina fase" onclick="delPh('${f.id}')">${I("x",18)}</button></div>`).join(""):'<p class="empty-t">Nessuna fase: creane una qui sotto.</p>'}</div>
 <div class="panel pad"><h3>Nuova fase</h3><div><label for="ft">Obiettivo</label><select id="ft"><option value="massa">Massa</option><option value="def">Definizione</option><option value="ric">Ricomposizione</option><option value="man">Mantenimento</option></select></div>
 <button class="sec wide" onclick="autoPh()">Calcola kcal e macro</button><p class="mut small" id="am" style="margin:0"></p>
 <div class="f2"><div><label for="fn">Nome</label><input id="fn" placeholder="Massa"></div><div><label for="fs">Inizio</label><input id="fs" type="date" value="${today()}"></div><div><label for="fk">Target kcal</label><input id="fk" type="number" inputmode="numeric"></div><div><label for="fp">Proteine g</label><input id="fp" type="number" inputmode="numeric"></div><div><label for="fc">Carboidrati g</label><input id="fc" type="number" inputmode="numeric"></div><div><label for="ff">Grassi g</label><input id="ff" type="number" inputmode="numeric"></div></div>
 <button class="pri wide" onclick="addPh()">Aggiungi fase</button></div></section>
 <section class="block"><h2>Profilo</h2><div class="panel pad"><div class="f2"><div><label for="ps">Sesso</label><select id="ps"><option value="M" ${p.sex==="M"?"selected":""}>Uomo</option><option value="F" ${p.sex==="F"?"selected":""}>Donna</option></select></div><div><label for="pa">Età</label><input id="pa" type="number" inputmode="numeric" value="${p.age}"></div><div><label for="ph">Altezza cm</label><input id="ph" type="number" inputmode="numeric" value="${p.h}"></div><div><label for="pw">Peso iniziale kg</label><input id="pw" type="number" step="0.1" inputmode="decimal" value="${p.w}"></div></div>
 <div><label for="pc">Attività quotidiana (senza allenamenti)</label><select id="pc">${[[1.2,"Sedentaria ×1,2"],[1.375,"Leggera ×1,375"],[1.55,"Moderata ×1,55"],[1.725,"Alta ×1,725"]].map(a=>`<option value="${a[0]}" ${a[0]==p.act?"selected":""}>${a[1]}</option>`).join("")}</select></div>
 <button class="pri wide" onclick="saveProf()">Salva profilo</button></div></section>
 <section class="block"><h2>Backup</h2><div class="panel pad"><p class="mut small" style="margin:0">Esporta i dati e conserva il testo (per esempio in Note). Per ripristinarli incollalo qui e premi Importa.</p><label for="bk" class="vh">Dati</label><textarea id="bk" rows="4"></textarea><div class="inrow"><button class="sec wide" onclick="expo()">Esporta</button><button class="sec wide" onclick="impo()">Importa</button></div><span class="mut small" id="bm"></span></div></section>`}
function autoPh(){const t=$("ft").value,w=curW(),M=bmr()*S.profile.act+250;
 const c={massa:[1.10,1.8,1.0,"Massa"],def:[0.80,2.2,0.8,"Definizione"],ric:[1.0,2.2,0.9,"Ricomposizione"],man:[1.0,1.8,1.0,"Mantenimento"]}[t];
 const k=Math.max(R(M*c[0]/10)*10,R(bmr()/10)*10),p=R(w*c[1]),f=R(w*c[2]),cb=Math.max(0,R((k-4*p-9*f)/4));
 $("fk").value=k;$("fp").value=p;$("fc").value=cb;$("ff").value=f;if(!$("fn").value)$("fn").value=c[3];
 $("am").textContent="Mantenimento stimato circa "+N(M)+" kcal. Target "+N(k)+" kcal · P "+p+" g · C "+cb+" g · G "+f+" g."}
function saveProf(){S.profile={sex:$("ps").value,age:num("pa"),h:num("ph"),w:num("pw"),act:parseFloat($("pc").value)};save();msg="Profilo salvato.";render()}
function addPh(){const n=$("fn").value.trim(),k=num("fk");if(!n||k<=0)return;S.phases.push({id:uid(),name:n,start:$("fs").value||today(),kcal:k,p:num("fp"),c:num("fc"),f:num("ff")});save();msg="Fase aggiunta.";render()}
function delPh(id){S.phases=S.phases.filter(x=>x.id!==id);save();render()}
function expo(){const t=JSON.stringify(S);$("bk").value=t;$("bk").select();try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}$("bm").textContent="Esportato: copia il testo e conservalo."}
function impo(){try{const d=JSON.parse($("bk").value);S=Object.assign(S,d);save();msg="Dati importati.";render()}catch(e){$("bm").textContent="Il testo incollato non è un backup valido."}}

/* struttura */
const VIEW={oggi:vOggi,cibo:vCibo,allena:vAllena,prog:vProg},SUB={add:vAdd,piano:vPiano,builder:vBuilder,log:vLog};
const TABS=[["oggi","Oggi","home"],["cibo","Cibo","food"],["allena","Allena","lift"],["prog","Progressi","chart"]];
function vHead(){
 if(sub){const t={add:addSlot,piano:"Piano",builder:"Nuova scheda",log:"Registra esercizio"}[sub];
  const eb={add:"Aggiungi a · "+dayName(day),piano:"Fasi, profilo e backup",builder:"Allena",log:"Allena"}[sub];
  return `<button class="back" onclick="closeSub()">${I("back",20)} Indietro</button><div><span class="eyebrow">${esc(eb)}</span><h1>${esc(t)}</h1></div>${sub==="log"?dateBar():""}`}
 const ph=phaseOn(day),tot=today();
 const title={oggi:dayName(day),cibo:"Cibo",allena:"Allena",prog:"Progressi"}[tab];
 const eb={oggi:ph?"Fase · "+ph.name:"Nessuna fase attiva",cibo:dayName(day),allena:ss?"Sessione in corso":S.routines.length+(S.routines.length===1?" scheda":" schede"),prog:phaseOn(tot)?"Fase · "+phaseOn(tot).name:"Andamento"}[tab];
 return `<div class="top"><div><span class="eyebrow">${esc(eb)}</span><h1>${esc(title)}</h1></div><button class="ico" aria-label="Piano, profilo e backup" onclick="openSub('piano')">${I("gear")}</button></div>${tab==="oggi"||tab==="cibo"?dateBar():""}`}
function render(){const key=tab+"|"+(sub||""),same=render.k===key,y=window.scrollY;render.k=key;
 $("hd").innerHTML=vHead();
 $("view").innerHTML=sub?SUB[sub]():VIEW[tab]();
 $("nv").innerHTML=TABS.map(([k,l,i])=>`<button class="${k===tab?"on":""}" ${k===tab?'aria-current="page"':""} onclick="setTab('${k}')">${I(i)}<span>${l}</span></button>`).join("");
 if(sub==="add")fl();
 window.scrollTo(0,same?y:0)}
render();
if(ss)wake();
</script>

</body></html>
